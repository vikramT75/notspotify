name: DevOps CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend (Maven)
        run: |
          cd spotify-backend-java
          mvn -B clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build Clone Frontend
        run: |
          cd spotify-clone
          npm ci
          npm run build

      - name: Build Admin Frontend
        run: |
          cd spotify-admin
          npm ci
          npm run build

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spotify-backend:latest ./spotify-backend-java
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spotify-backend:latest

      - name: Build and Push Clone Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spotify-clone:latest ./spotify-clone
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spotify-clone:latest

      - name: Build and Push Admin Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spotify-admin:latest ./spotify-admin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spotify-admin:latest
