name: DevOps CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Backend (Maven)
        run: |
          cd spotify-backend-java
          mvn -B clean package

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build Clone Frontend
        run: |
          cd spotify-clone
          npm ci
          npm run build

      - name: Build Admin Frontend
        run: |
          cd spotify-admin
          npm ci
          npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install & Build Clone Frontend
        run: |
          cd spotify-clone
          npm ci
          npm run build

      - name: Install & Build Admin Frontend
        run: |
          cd spotify-admin
          npm ci
          npm run build

      - name: Run Clone Playwright E2E Tests
        run: |
          cd spotify-clone
          npx playwright test

      - name: Run Admin Playwright E2E Tests
        run: |
          cd spotify-admin
          npx playwright test

      - name: Upload Playwright Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            spotify-clone/playwright-report
            spotify-admin/playwright-report
          retention-days: 14

  docker-build:
    if: github.event_name == 'push'
    needs: [build-and-test, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spotify-backend:latest ./spotify-backend-java
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spotify-backend:latest

      - name: Build and Push Clone Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spotify-clone:latest ./spotify-clone
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spotify-clone:latest

      - name: Build and Push Admin Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spotify-admin:latest ./spotify-admin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spotify-admin:latest
