version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: spotify_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: spotify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d spotify"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./spotify-backend-java
    container_name: spotify_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DB_URL=jdbc:postgresql://postgres-db:5432/spotify
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - CLOUDINARY_NAME=${CLOUDINARY_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      postgres-db:
        condition: service_healthy

  clone:
    build:
      context: ./spotify-clone
    container_name: spotify_clone
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend

  admin:
    build:
      context: ./spotify-admin
    container_name: spotify_admin
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
