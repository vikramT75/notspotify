apiVersion: v1
kind: Service
metadata:
  name: spotify-admin
  namespace: {{ .Values.global.namespace }}
  labels:
    app: spotify-admin
    {{- include "notspotify.labels" . | nindent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  ports:
    - port: {{ .Values.admin.service.port }}
      targetPort: {{ .Values.admin.service.port }}
      protocol: TCP
      name: http
  selector:
    app: spotify-admin
