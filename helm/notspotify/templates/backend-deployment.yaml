apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: spotify-backend
    {{- include "notspotify.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: spotify-backend
  template:
    metadata:
      labels:
        app: spotify-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
              name: http
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: notspotify-secrets
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notspotify-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notspotify-secrets
                  key: POSTGRES_PASSWORD
            - name: CLOUDINARY_NAME
              valueFrom:
                secretKeyRef:
                  name: cloudinary-secrets
                  key: CLOUDINARY_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudinary-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudinary-secrets
                  key: CLOUDINARY_API_SECRET
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/song/list
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/song/list
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 40
            periodSeconds: 20
