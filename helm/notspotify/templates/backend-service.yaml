apiVersion: v1
kind: Service
metadata:
  name: spotify-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: spotify-backend
    {{- include "notspotify.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
      name: http
  selector:
    app: spotify-backend
