{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notspotify-ingress
  namespace: {{ .Values.global.namespace }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    # Strip the path prefix before forwarding to each service.
    # $1 captures the trailing path after /admin or /api so the pod sees clean paths.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  labels:
    {{- include "notspotify.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          # /api(/|$)(.*) → backend pod receives /$2 (e.g. /api/song/list → /api/song/list)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: spotify-backend
                port:
                  number: {{ .Values.backend.service.port }}
          # /admin(/|$)(.*) → admin pod receives /$2 (strips the /admin prefix)
          # e.g. /admin → /, /admin/add-song → /add-song
          - path: /admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: spotify-admin
                port:
                  number: {{ .Values.admin.service.port }}
          # Everything else → clone frontend (receives full path)
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: spotify-clone
                port:
                  number: {{ .Values.clone.service.port }}
{{- end }}
