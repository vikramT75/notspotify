apiVersion: v1
kind: Secret
metadata:
  name: notspotify-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "notspotify.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DB_URL: "jdbc:postgresql://postgres.{{ .Values.global.namespace }}.svc.cluster.local:5432/{{ .Values.postgres.database }}"
