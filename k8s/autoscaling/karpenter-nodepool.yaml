apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  role: notspotify-eks-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: notspotify-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: notspotify-eks
  tags:
    karpenter.sh/discovery: notspotify-eks
    Project: NotSpotify
    Environment: dev
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        provisioner: karpenter
    spec:
      nodeClassRef:
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"] # Automatically mix on-demand and cheap spot instances
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "t"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
  limits:
    cpu: 50
    memory: 100Gi
  disruption:
    consolidationPolicy: WhenUnderutilized # Automatically shrinks nodes when traffic subsides
    expireAfter: 720h # 30 days
